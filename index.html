/* ПЕРЕОПРЕДЕЛЕННЫЕ СТИЛИ ДЛЯ ЕДИНОЙ БОЛЬШОЙ КНОПКИ */
.task {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding: 0 !important; /* Убираем внутренние отступы */
    border-radius: 16px;
    background: transparent !important; /* Прозрачный фон */
    font-family: 'Roboto', Arial, sans-serif;
    color: white;
    box-shadow: none !important; /* Убираем тень */
    border: none !important; /* Убираем границу */
    transition: all 0.3s ease;
    box-sizing: border-box;
}

/* Скрываем все внутренние элементы AdsGram кроме слота reward */
.task ::slotted(:not([slot="reward"])) {
    display: flex;
    visibility: hidden !important;
    opacity: 0 !important;
    width: 0 !important;
    height: 0 !important;
    padding: 0 !important;
    margin: 0 !important;
}

/* Скрываем внутреннюю структуру AdsGram */
.task > *:not(slot) {
    display: none !important;
}

/* Стили для самой кнопки-награды */
.task_reward {
    display: flex;
    align-items: center !important;
    justify-content: center !important;
    width: 100% !important;
    height: 60px !important; /* Высокая кнопка */
    background: linear-gradient(135deg, #FF6B6B 0%, #FF5252 100%) !important; /* Яркий монотонный градиент */
    color: white !important;
    font-weight: bold !important;
    font-size: 18px !important;
    padding: 0 !important;
    border-radius: 16px !important;
    margin: 0 !important;
    box-shadow: 0 6px 20px rgba(255, 82, 82, 0.4) !important;
    text-align: center !important;
    box-sizing: border-box !important;
    cursor: pointer !important;
    border: none !important;
    transition: all 0.3s ease !important;
    text-decoration: none !important;
}

/* Эффекты при наведении */
.task_reward:hover {
    transform: translateY(-2px) !important;
    box-shadow: 0 8px 25px rgba(255, 82, 82, 0.6) !important;
}

.task_reward:active {
    transform: translateY(0) !important;
    box-shadow: 0 4px 15px rgba(255, 82, 82, 0.4) !important;
}

/* Адаптивность для мобильных устройств */
@media (max-width: 480px) {
    .adsgram-container {
        max-width: 300px;
        width: calc(100% - 32px);

    .task_reward {

}

@media (max-width: 360px) {
    .adsgram-container {
        max-width: 280px;
    }
    
    .task_reward {
        height: 50px !important;
        font-size: 15px !important;
    }
}

        // === Telegram Init ===
        function initTelegramFeatures() {
            if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
                const isMobile = /Mobile|Android|iPhone/i.test(navigator.userAgent);

                try {
                    if (isMobile) {
                        Telegram.WebApp.expand();
                        Telegram.WebApp.disableVerticalSwipes();
                        Telegram.WebApp.lockOrientation('portrait');
                        console.log("Telegram mobile features initialized");
                    } else {
                        console.log("Telegram PC features initialized");
                    }

                    Telegram.WebApp.ready();
                } catch (e) {
                    console.error("Error initializing Telegram:", e);
                }
            } else {
                console.error("Telegram SDK not found!");
            }
        }
    </script>

       function showTaskAds() {
    const task = document.querySelector("adsgram-task");
    if (!task) {
        console.warn("AdsGram task not found");
        return;
    }

    // Функция проверки готовности компонента
    function waitForTaskReady(retries = 20, interval = 200) {
        return new Promise((resolve, reject) => {
            let attempt = 0;

            const check = () => {
                attempt++;
                // Проверяем, есть ли метод _firstRender и завершился ли рендер
                if (task._firstRender) {
                    resolve();
                } else if (attempt >= retries) {
                    reject("AdsGram task not ready after waiting");
                } else {
                    setTimeout(check, interval);
                }
            };

            check();
        });
    }

    // Ждём готовности таски и вызываем клик
    waitForTaskReady()
        .then(() => {
            const buttonSlot = task.querySelector('[slot="button"]');
            if (buttonSlot) {
                buttonSlot.click();
                console.log("AdsGram task triggered via button click (ready version)");
            } else {
                console.warn("Button slot not found inside AdsGram task");
            }
        })
        .catch(err => {
            console.error(err);
        });
}

        // === AdsGram Task Logic ===
        function initAdsGramTask() {
            const taskElement = document.querySelector('adsgram-task');
            const statusMessage = document.getElementById('status-message');
            
            if (!taskElement) {
                console.error('AdsGram task element not found');
                return;
            }

            // Функция для показа сообщений
            function showStatusMessage(message, duration = 3000) {
                if (statusMessage) {
                    statusMessage.textContent = message;
                    statusMessage.style.display = 'block';
                    
                    setTimeout(() => {
                        statusMessage.style.display = 'none';
                    }, duration);
                }
            }
               
            // Обработчик события reward
            taskElement.addEventListener('reward', (event) => {
                console.log('AdsGram Task completed!', event);
                // showStatusMessage('Задание выполнено! Тестовая попытка получена!');
                // Отправка сообщения в Unity о получении награды
                if (myGameInstance) {
                    myGameInstance.SendMessage('AdsManager', 'TaskCompleted');
                }
            });

            // Обработчик ошибок
            taskElement.addEventListener('onError', (event) => {
                console.error('AdsGram Task error:', event);
                showStatusMessage('Ошибка загрузки задания', 5000);
            });

            // Обработчик отсутствия баннера
            taskElement.addEventListener('onBannerNotFound', (event) => {
                console.warn('AdsGram Task banner not found:', event);
                showStatusMessage('Задания временно недоступны', 5000);
                
                // Скрываем контейнер с заданием
                const container = document.querySelector('.adsgram-container');
                if (container) {
                    container.style.display = 'none';
                }
            });

            // Обработчик долгой сессии
            taskElement.addEventListener('onTooLongSession', (event) => {
                console.warn('AdsGram Task session too long:', event);
                showStatusMessage('Сессия слишком долгая, перезапустите приложение', 5000);
            });

            console.log('AdsGram Task initialized with event listeners');
        }
