.task {
    --adsgram-task-font-size: 16px;
    --adsgram-task-icon-size: 58px;
    --adsgram-task-icon-title-gap: 15px;
    --adsgram-task-button-width: 80px;
    --adsgram-task-icon-border-radius: 12px;

    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding: 12px 16px;
    border-radius: 16px;
    background: linear-gradient(135deg, #1a73e8 0%, #4285f4 100%);
    font-family: 'Roboto', Arial, sans-serif;
    color: white;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.2);
    transition: all 0.3s ease;
    box-sizing: border-box;
}

.task:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(0, 0, 0, 0.2);
}

.task_reward {
    background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
    color: #5d4037;
    font-weight: bold;
    padding: 6px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(255, 193, 7, 0.4);
    text-align: center;
    width: 90%;
    max-width: 90%;
    box-sizing: border-box;
}

.task_button {
    background: linear-gradient(135deg, #34a853 0%, #4caf50 100%);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 6px 12px; /* 6px сверху/снизу, 12px слева/справа */
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    transition: all 0.3s ease;
    box-shadow: 0 2px 8px rgba(52, 168, 83, 0.4);
    width: auto; /* Автоматическая ширина по содержимому */
    max-width: 100%; /* Не больше контейнера */
    box-sizing: border-box;
}

.task_button:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(52, 168, 83, 0.6);
}

.task_button_done {
    background: linear-gradient(135deg, #9e9e9e 0%, #757575 100%);
    box-shadow: 0 2px 8px rgba(117, 117, 117, 0.4);
}

.task_button_done:hover {
    transform: none;
    box-shadow: 0 2px 8px rgba(117, 117, 117, 0.4);
}

/* Адаптивность для мобильных устройств */

    }
}

@media (max-width: 360px) {

    }

        padding: 8px 10px;
    }
    
    .task_button {
        padding: 6px 6px;
        font-size: 13px;
    }
}

    <script>
        // === Telegram Init ===
        function initTelegramFeatures() {
            if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
                const isMobile = /Mobile|Android|iPhone/i.test(navigator.userAgent);

                try {
                    if (isMobile) {
                        Telegram.WebApp.expand();
                        Telegram.WebApp.disableVerticalSwipes();
                        Telegram.WebApp.lockOrientation('portrait');
                        console.log("Telegram mobile features initialized");
                    } else {
                        console.log("Telegram PC features initialized");
                    }

                    Telegram.WebApp.ready();
                } catch (e) {
                    console.error("Error initializing Telegram:", e);
                }
            } else {
                console.error("Telegram SDK not found!");
            }
        }
    </script>

    <script>
        // Обработчики фокуса/вкладки
        function handleFocus() {
            if (myGameInstance) {
                myGameInstance.SendMessage('PartnersSubscriptionChecker', 'CheckSubscriptionExtern');
            }
        }

        function handleVisibilityChange() {
            if (document.visibilityState === 'visible' && myGameInstance) {
                myGameInstance.SendMessage('PartnersSubscriptionChecker', 'CheckSubscriptionExtern');
            }
        }

        document.addEventListener('visibilitychange', handleVisibilityChange);
        window.addEventListener('focus', handleFocus);

        var canvas = document.querySelector("#unity-canvas");
        var logo = document.querySelector("#unity-logo");
        var addBg = document.querySelector("#additional-background");
        var warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type === 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type === 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function () {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/telegram_games_unity_build.loader.js";
        var config = {
            arguments: [],
            dataUrl1: "https://raw.githubusercontent.com/burtimax/telegram_games_unity_build/refs/heads/master/Build/telegram_games_unity_build.data.unityweb",
            dataUrl: buildUrl + "/telegram_games_unity_build.data.unityweb",
            frameworkUrl: buildUrl + "/telegram_games_unity_build.framework.js.unityweb",
            codeUrl1: "https://raw.githubusercontent.com/burtimax/telegram_games_unity_build/refs/heads/master/Build/telegram_games_unity_build.wasm.unityweb",
            codeUrl: buildUrl + "/telegram_games_unity_build.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DinoCarbone",
            productName: "DailyRaffles",
            productVersion: "1.0",
            showBanner: unityShowBanner,
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            document.querySelector("#unity-container").className = "unity-mobile";
            canvas.className = "unity-mobile";
        }

        let myGameInstance = null;

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, () => {
                // Progress callback (можно сделать отображение прогресса)
            }).then((unityInstance) => {
                myGameInstance = unityInstance;
                logo.style.display = "none";

        // === Новый вызов полноэкранной рекламы Adextra ===
        function showAds() {
            const id = "bdb4668e659ee063bd17359de7eba3d726e43e70";

            const onSuccess = () => {
                console.log("--Ad Shown Successfully--");
                if (myGameInstance) {
                    myGameInstance.SendMessage('AdsManager', 'WatchEnd');
                }
            };

            const onError = () => {
                console.log("--Ad Failed or Skipped--");
                if (myGameInstance) {
                    myGameInstance.SendMessage('AdsManager', 'Close');
                }
            };

            if (typeof p_adextra === "function") {
                p_adextra(onSuccess, onError);
            } else {
                console.warn("p_adextra not loaded");
            }
        }

        // Вызов рекламы (например, из Unity через SendMessage → showAds)
        window.showAds = showAds;

        // === AdsGram Task Logic ===
        function initAdsGramTask() {
            const taskElement = document.querySelector('adsgram-task');
            const statusMessage = document.getElementById('status-message');
            
            if (!taskElement) {
                console.error('AdsGram task element not found');
                return;
            }

            // Функция для показа сообщений
            function showStatusMessage(message, duration = 3000) {
                if (statusMessage) {
                    statusMessage.textContent = message;
                    statusMessage.style.display = 'block';
                    
                    setTimeout(() => {
                        statusMessage.style.display = 'none';
                    }, duration);
                }
            }
               
            // Обработчик события reward
            taskElement.addEventListener('reward', (event) => {
                console.log('AdsGram Task completed!', event);
                // showStatusMessage('Задание выполнено! Тестовая попытка получена!');
                // Отправка сообщения в Unity о получении награды
                if (myGameInstance) {
                    myGameInstance.SendMessage('AdsManager', 'TaskCompleted');
                }
            });

            // Обработчик ошибок
            taskElement.addEventListener('onError', (event) => {
                console.error('AdsGram Task error:', event);
                showStatusMessage('Ошибка загрузки задания', 5000);
            });

            // Обработчик отсутствия баннера
            taskElement.addEventListener('onBannerNotFound', (event) => {
                console.warn('AdsGram Task banner not found:', event);
                showStatusMessage('Задания временно недоступны', 5000);
                
                // Скрываем контейнер с заданием
                const container = document.querySelector('.adsgram-container');
                if (container) {
                    container.style.display = 'none';
                }
            });

            // Обработчик долгой сессии
            taskElement.addEventListener('onTooLongSession', (event) => {
                console.warn('AdsGram Task session too long:', event);
                showStatusMessage('Сессия слишком долгая, перезапустите приложение', 5000);
            });

            console.log('AdsGram Task initialized with event listeners');
        }
    </script>
